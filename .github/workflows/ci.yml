# Checks every push and pull request on Windows, the only platform Resona
# runs on (WASAPI, SMTC, the Spotify desktop client).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch or pull request supersedes the run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain comes from rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes the check that every interface text has its French
      # translation (crates/app/src/i18n.rs).
      - run: cargo test --workspace --locked

  licences:
    name: Third-party licences up to date
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2
      # THIRD_PARTY_LICENSES.md ships with resona.exe: it must match
      # Cargo.lock. After a dependency change (Dependabot included), run the
      # same command and commit the result.
      - run: cargo about generate --workspace --locked -o THIRD_PARTY_LICENSES.md about.hbs
      - name: The committed file matches
        shell: bash
        run: |
          if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
            echo "::error::THIRD_PARTY_LICENSES.md is out of date: run 'cargo about generate --workspace -o THIRD_PARTY_LICENSES.md about.hbs' and commit it"
            exit 1
          fi
