# CodeQL security analysis of the Rust code and of these workflows. Runs on
# pushes, pull requests and weekly, and gates every release (release.yml
# calls it and builds only if it passes).
#
# The repository is private: GitHub only accepts the results (Security tab)
# with GitHub Code Security enabled. So the job does not rely on the
# upload. It reads the SARIF itself and fails on any finding; the upload is
# still attempted and allowed to fail, and works as is once the repository
# is public or Code Security is on.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "34 7 * * 4"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The Rust code is Windows-only (#[cfg(windows)] almost everywhere):
    # analyzed elsewhere, most of it would count as inactive.
    runs-on: ${{ matrix.language == 'rust' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - if: matrix.language == 'rust'
        run: rustup show active-toolchain
      - if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The full dependency graph up front, so the extractor resolves every
      # crate without reaching the registry midway.
      - if: matrix.language == 'rust'
        run: cargo fetch --locked

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - 'target/**'

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Upload to the Security tab (needs a public repository or Code Security)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"

      # Third-party actions in these workflows are pinned to a commit SHA:
      # the actions analysis flags a movable tag, and this step would then
      # block every release.
      - name: Fail on any finding
        shell: pwsh
        run: |
          $files = @(Get-ChildItem sarif-results -Filter *.sarif -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Host "::error::no SARIF produced: the analysis did not run"
            exit 1
          }
          $findings = 0
          foreach ($file in $files) {
            $sarif = Get-Content $file.FullName -Raw | ConvertFrom-Json
            foreach ($run in $sarif.runs) {
              foreach ($result in @($run.results)) {
                if ($null -eq $result) { continue }
                $findings++
                $where = $result.locations[0].physicalLocation
                Write-Host "::error file=$($where.artifactLocation.uri),line=$($where.region.startLine)::$($result.ruleId): $($result.message.text)"
              }
            }
          }
          Write-Host "$findings finding(s)"
          if ($findings -gt 0) { exit 1 }
