# Builds the installer for a version tag (`v0.2.0`) and publishes it as a
# GitHub release, which the app's update check then offers.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the version in Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - run: cargo test --workspace
      - run: cargo install cargo-packager --locked
      - run: cargo packager --release -p resona
      - uses: softprops/action-gh-release@v2
        with:
          files: target/packager/*.exe
          generate_release_notes: true
