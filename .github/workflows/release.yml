# Builds the installer for a version tag (`v0.2.0`) and publishes it as a
# GitHub release, which the app's update check then offers. Nothing is
# built unless the tag matches Cargo.toml, the tests pass and CodeQL finds
# nothing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

  codeql:
    name: CodeQL
    needs: version
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  release:
    name: Build and publish
    needs: [version, codeql]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - run: cargo install cargo-packager --locked
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-about@0.9.2
      # The licences installed next to resona.exe match the build exactly.
      - run: cargo about generate --workspace --locked -o THIRD_PARTY_LICENSES.md about.hbs

      # Authenticode, as in WaveFlow and with the same certificate. It is
      # self-signed: files are signed (tampering shows) but Windows does
      # not trust the publisher, so SmartScreen still warns. Replacing the
      # two secrets with a certificate from a CA in Microsoft's Trusted Root
      # Program is all it takes to change that.
      #
      # cargo-packager signs resona.exe, the uninstaller and the installer
      # with signtool, by the thumbprint of a certificate in the store (its
      # custom-command mode splits on spaces, and signtool's path has some).
      - name: Import the signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNTOOL_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNTOOL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            Write-Error "SIGNTOOL_PFX_BASE64 and SIGNTOOL_PFX_PASSWORD are required to publish a release"
            exit 1
          }
          Write-Host "::add-mask::$env:PFX_PASSWORD"
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          if (-not $cert.HasPrivateKey) { Write-Error "the PFX has no private key"; exit 1 }
          $thumbprint = $cert.Thumbprint
          Write-Host "Signing with $($cert.Subject) ($thumbprint), valid until $($cert.NotAfter)"
          "SIGNING_THUMBPRINT=$thumbprint" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # The thumbprint is public; the private key stays in the store.
          @"

          [package.metadata.packager.windows]
          digest-algorithm = "SHA256"
          certificate-thumbprint = "$thumbprint"
          timestamp-url = "http://timestamp.digicert.com"
          tsp = true
          "@ | Add-Content crates/app/Cargo.toml

      - run: cargo packager --release -p resona

      - name: Check the signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/packager/*.exe) + @(Get-Item target/release/resona.exe)
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            # A self-signed certificate reads "UnknownError" (untrusted root):
            # what matters is that it is ours and timestamped.
            if ($sig.SignerCertificate.Thumbprint -ne $env:SIGNING_THUMBPRINT) {
              Write-Error "$($file.Name) is not signed with the release certificate ($($sig.Status))"
              exit 1
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Error "$($file.Name) has no timestamp"
              exit 1
            }
            Write-Host "$($file.Name): signed by $($sig.SignerCertificate.Subject), $($sig.Status)"
          }
      # So a downloaded installer can be checked.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem target/packager/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content target/packager/SHA256SUMS.txt -Encoding ascii
          Get-Content target/packager/SHA256SUMS.txt

      # The notes are written by hand in docs/releases/<tag>.md, ending with a
      # "Full changelog" link; GitHub's generated list is left out (for a
      # first release it showed only a Dependabot bump).
      - name: The release notes exist
        shell: bash
        run: test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "::error::docs/releases/$GITHUB_REF_NAME.md is missing"; exit 1; }

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Resona ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            target/packager/*.exe
            target/packager/SHA256SUMS.txt
          generate_release_notes: false
