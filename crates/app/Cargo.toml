[package]
name = "resona"
description = "Records the Spotify desktop client, lossless, one file per track."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.17", default-features = false }
# Same feature set as WaveFlow's measured Slint prototype: the software
# renderer on winit kept the process around 10 MB private memory, which
# matters for an app left recording overnight.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-18",
] }
resona-core = { path = "../core" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
wasapi = "0.24"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

# Installer: `cargo packager --release -p resona` (cargo-packager, NSIS).
# Per-user, no administrator rights, like the app itself needs none.
[package.metadata.packager]
product-name = "Resona"
identifier = "io.github.instazdll.resona"
publisher = "InstaZDLL"
category = "Music"
formats = ["nsis"]
icons = ["assets/resona.ico"]
out-dir = "../../target/packager"
before-packaging-command = "cargo build --release -p resona"
binaries = [{ path = "resona", main = true }]
# Installed next to resona.exe: the licences that ship with the binary.
resources = [
    { src = "../../LICENSE", target = "LICENSE.txt" },
    { src = "../../THIRD_PARTY_NOTICES.md", target = "THIRD_PARTY_NOTICES.md" },
    { src = "../../THIRD_PARTY_LICENSES.md", target = "THIRD_PARTY_LICENSES.md" },
]

[package.metadata.packager.nsis]
installer-icon = "assets/resona.ico"
installer-mode = "currentUser"
languages = ["French", "English"]
display-language-selector = false
