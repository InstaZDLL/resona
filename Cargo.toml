[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/InstaZDLL/resona"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The engine checks every sample and encodes FLAC as the music plays: in
# an unoptimized build it fell behind real time (tracks shown 20 s late,
# 2026-10-04). Dependencies and the engine are optimized even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.resona-core]
opt-level = 3
